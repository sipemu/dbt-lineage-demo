# .github/workflows/lineage-site.yml
name: Lineage site

on:
  push:
    branches: [main]
  # Rebuild after the Exposures workflow commits regenerated exposures
  # (pushes made with GITHUB_TOKEN don't trigger workflows).
  workflow_run:
    workflows: [Exposures]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dbt-lineage
        env:
          VERSION: 0.15.0
        run: |
          curl -fsSL "https://github.com/sipemu/dbt-lineage-viewer/releases/download/v$VERSION/dbt-lineage-v$VERSION-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --strip-components=1
          sudo mv dbt-lineage /usr/local/bin/
      - run: dbt-lineage site -p . --out site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
