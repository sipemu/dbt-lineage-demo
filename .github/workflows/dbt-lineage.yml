name: dbt-lineage

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write    # sticky PR comment
  security-events: write  # SARIF upload (inline lint/coverage findings)

jobs:
  lineage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: sipemu/dbt-lineage-viewer@v0
        id: lineage
        with:
          sarif: lint,coverage
          fail-on: lint-errors
      - name: Show rebuild selector
        run: echo 'dbt build -s "${{ steps.lineage.outputs.selector }}"'
